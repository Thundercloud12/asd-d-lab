version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
  pre_build:
    commands:
      - echo "Checking files before deployment..."
      - ls -la
  build:
    commands:
      - echo "No build steps required for static HTML."
  post_build:
    commands:
      - echo "Deploying index.html securely to private S3 bucket..."
      - aws s3 cp index.html s3://sotre-build-artifact-vb/
